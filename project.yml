name: EasyTree
options:
  bundleIdPrefix: com.krystofwoldrich
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  EasyTree:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.0.0"

schemes:
  EasyTreeApp:
    build:
      targets:
        EasyTreeApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EasyTreeAppTests

targets:
  EasyTreeApp:
    type: application
    platform: macOS
    sources:
      - EasyTreeApp
    dependencies:
      - package: EasyTree
        product: EasyTreeKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krystofwoldrich.EasyTreeApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: EasyTreeApp/EasyTreeApp.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: EasyTreeApp/Info.plist
        PRODUCT_NAME: EasyTree
        MACOSX_DEPLOYMENT_TARGET: "26.0"
    entitlements:
      path: EasyTreeApp/EasyTreeApp.entitlements

  EasyTreeAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/EasyTreeAppTests
    dependencies:
      - target: EasyTreeApp
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
