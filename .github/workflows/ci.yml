name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install global tools
        run: brew install swiftlint swift-format xcodegen

      - name: Run lint
        run: |
          swiftlint lint --strict
          swift-format lint --strict --recursive Sources Tests EasyTreeApp

      - name: Resolve Swift dependencies
        run: swift package resolve

      - name: Build library
        run: swift build --target EasyTreeKit

      - name: Build CLI
        run: swift build --target EasyTreeCLI

      - name: Run Unit Tests
        run: swift test

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build macOS app
        run: |
          xcodebuild build \
            -project EasyTree.xcodeproj \
            -scheme EasyTreeApp \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO
