name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Build, Test & Release
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install global tools
        run: brew install swiftlint swift-format xcodegen

      - name: Run lint
        run: |
          swiftlint lint --strict
          swift-format lint --strict --recursive Sources Tests EasyTreeApp

      - name: Resolve Swift dependencies
        run: swift package resolve

      - name: Build library
        run: swift build --target EasyTreeKit

      - name: Build CLI
        run: swift build --target EasyTreeCLI

      - name: Run Unit Tests
        run: swift test

      - name: Set version from commit hash
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "VERSION=${COMMIT_HASH}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${COMMIT_COUNT}" >> $GITHUB_ENV

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import code signing certificate
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp /tmp/cert.XXXXXX.p12)
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH="/tmp/easytree-ci-${KEYCHAIN_PASSWORD}.keychain-db"

          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_FILE" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> $GITHUB_ENV

          rm "$CERT_FILE"

      - name: Build and archive macOS app
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            xcodebuild archive \
              -project EasyTree.xcodeproj \
              -scheme EasyTreeApp \
              -configuration Release \
              -archivePath build/EasyTree.xcarchive \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Developer ID Application" \
              DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
              ENABLE_HARDENED_RUNTIME=YES \
              OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime --keychain ${{ env.KEYCHAIN_PATH }}" \
              MARKETING_VERSION="${{ env.VERSION }}" \
              CURRENT_PROJECT_VERSION="${{ env.BUILD_NUMBER }}" \
              SPARKLE_ED_PUBLIC_KEY="${{ secrets.SPARKLE_ED_PUBLIC_KEY }}"
          else
            xcodebuild build \
              -project EasyTree.xcodeproj \
              -scheme EasyTreeApp \
              -destination "platform=macOS" \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Export and re-sign app
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p build/export
          cp -R build/EasyTree.xcarchive/Products/Applications/EasyTree.app build/export/

          APP="build/export/EasyTree.app"
          SIGN_IDENTITY="Developer ID Application"
          SIGN_FLAGS="--force --timestamp --options=runtime --keychain ${{ env.KEYCHAIN_PATH }}"

          # Re-sign all Sparkle nested binaries
          find "$APP/Contents/Frameworks" -type f -perm +111 | while read binary; do
            codesign $SIGN_FLAGS --sign "$SIGN_IDENTITY" "$binary" || true
          done

          # Sign XPC services
          find "$APP/Contents/Frameworks" -name "*.xpc" -type d | while read xpc; do
            codesign $SIGN_FLAGS --sign "$SIGN_IDENTITY" "$xpc"
          done

          # Sign Updater.app inside Sparkle
          find "$APP/Contents/Frameworks" -name "*.app" -type d | while read nested_app; do
            codesign $SIGN_FLAGS --sign "$SIGN_IDENTITY" "$nested_app"
          done

          # Sign the Sparkle framework
          codesign $SIGN_FLAGS --sign "$SIGN_IDENTITY" "$APP/Contents/Frameworks/Sparkle.framework"

          # Sign the main app
          codesign $SIGN_FLAGS --sign "$SIGN_IDENTITY" "$APP"

          # Verify
          codesign --verify --deep --strict "$APP"
          echo "Code signing verified successfully"

          cd build/export
          zip -r -y ../../EasyTree-${{ env.VERSION }}.zip EasyTree.app

      - name: Notarize app
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          SUBMIT_OUTPUT=$(xcrun notarytool submit EasyTree-${{ env.VERSION }}.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1) || true

          echo "$SUBMIT_OUTPUT"

          # Extract submission ID and fetch log on failure
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          if echo "$SUBMIT_OUTPUT" | grep -q "status: Invalid"; then
            echo "::error::Notarization failed. Fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi

          # Staple the app, then re-zip
          xcrun stapler staple build/export/EasyTree.app
          rm EasyTree-${{ env.VERSION }}.zip
          cd build/export
          zip -r -y ../../EasyTree-${{ env.VERSION }}.zip EasyTree.app

      - name: Sign with Sparkle EdDSA
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          SIGN_UPDATE=$(find build/EasyTree.xcarchive -name "sign_update" -type f 2>/dev/null | head -1)
          if [ -z "$SIGN_UPDATE" ]; then
            SIGN_UPDATE=$(find ~/Library/Developer/Xcode/DerivedData -name "sign_update" -type f 2>/dev/null | head -1)
          fi

          if [ -n "$SIGN_UPDATE" ] && [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then
            SIGNATURE=$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN_UPDATE" EasyTree-${{ env.VERSION }}.zip --ed-key-file -)
            echo "SPARKLE_SIGNATURE=${SIGNATURE}" >> $GITHUB_ENV
          else
            echo "sign_update or key not found, skipping Sparkle signature"
          fi

      - name: Generate release notes
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -1)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD | grep -v "Co-Authored-By")
          else
            NOTES=$(git log --pretty=format:"- %s" -20 | grep -v "Co-Authored-By")
          fi
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.VERSION }}" \
            EasyTree-${{ env.VERSION }}.zip \
            --title "EasyTree ${{ env.VERSION }}" \
            --notes "${{ env.RELEASE_NOTES }}" \
            --latest

      - name: Update appcast.xml
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          FILE_SIZE=$(stat -f%z EasyTree-${{ env.VERSION }}.zip)
          DOWNLOAD_URL="https://github.com/krystofwoldrich/easy-tree/releases/download/${{ env.VERSION }}/EasyTree-${{ env.VERSION }}.zip"
          PUB_DATE=$(date -R)

          ED_SIG=""
          if [ -n "${SPARKLE_SIGNATURE}" ]; then
            ED_SIG=$(echo "${SPARKLE_SIGNATURE}" | grep -o 'edSignature="[^"]*"' | sed 's/edSignature="//;s/"//')
          fi

          SIG_ATTR=""
          if [ -n "$ED_SIG" ]; then
            SIG_ATTR="sparkle:edSignature=\"${ED_SIG}\""
          fi

          cat > appcast.xml << APPCAST_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>EasyTree Updates</title>
              <language>en</language>
              <item>
                <title>EasyTree ${{ env.VERSION }}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${{ env.BUILD_NUMBER }}</sparkle:version>
                <sparkle:shortVersionString>${{ env.VERSION }}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <enclosure
                  url="${DOWNLOAD_URL}"
                  type="application/octet-stream"
                  ${SIG_ATTR}
                  length="${FILE_SIZE}"
                />
                <description><![CDATA[
                  <h2>Changes</h2>
                  <pre>${{ env.RELEASE_NOTES }}</pre>
                ]]></description>
              </item>
            </channel>
          </rss>
          APPCAST_EOF

          sed -i '' 's/^          //' appcast.xml

      - name: Commit appcast
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git diff --cached --quiet || git commit -m "Update appcast.xml for ${{ env.VERSION }}" && git push

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -n "${{ env.KEYCHAIN_PATH }}" ]; then
            security delete-keychain "${{ env.KEYCHAIN_PATH }}" 2>/dev/null || true
          fi
